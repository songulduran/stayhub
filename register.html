<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayHub - Hesap Oluştur</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <!-- Ekranı Dikey ve Yatayda Ortalamak İçin Flex Kapsayıcı -->
    <div
      class="container d-flex justify-content-center align-items-center register-container py-5"
    >
      <!-- Ortalanmış Kayıt Ol Kartı -->
      <div class="card border-0 shadow-sm rounded-3 p-4 p-sm-5 register-card">
        <!-- Logo veya Marka İsmi -->
        <div class="text-center mb-4">
          <a
            href="index.html"
            class="text-decoration-none fw-bold fs-3 text-primary"
          >
            <i class="bi bi-building-fill me-2"></i>StayHub
          </a>
        </div>

        <h4 class="fw-bold text-center mb-1 text-dark">Hesap Oluştur</h4>
        <p class="text-muted text-center small mb-4">
          Aramıza katılmak için bilgilerinizi eksiksiz doldurun
        </p>

        <form action="#" method="POST">
          <div class="row g-3">
            <!-- Ad -->
            <div class="col-12 col-sm-6">
              <label for="firstName" class="form-label fw-semibold">Ad</label>
              <input
                type="text"
                class="form-control"
                id="firstName"
                name="firstName"
                placeholder="Ahmet"
                required
                minlength="2"
                maxlength="50"
              />
            </div>

            <!-- Soyad -->
            <div class="col-12 col-sm-6">
              <label for="lastName" class="form-label fw-semibold">Soyad</label>
              <input
                type="text"
                class="form-control"
                id="lastName"
                name="lastName"
                placeholder="Yılmaz"
                required
                minlength="2"
                maxlength="50"
              />
            </div>

            <!-- E-posta -->
            <div class="col-12">
              <label for="registerEmail" class="form-label fw-semibold"
                >E-posta</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light text-muted">
                  <i class="bi bi-envelope"></i>
                </span>
                <input
                  type="email"
                  class="form-control"
                  id="registerEmail"
                  name="email"
                  placeholder="ornek@email.com"
                  required
                />
              </div>
            </div>

            <!-- Telefon -->
            <div class="col-12">
              <label for="phone" class="form-label fw-semibold">Telefon</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted">
                  <i class="bi bi-telephone"></i>
                </span>
                <input
                  type="tel"
                  class="form-control"
                  id="phone"
                  name="phone"
                  placeholder="05XX XXX XX XX"
                  pattern="[0-9]{10,11}"
                  title="Lütfen 10 veya 11 haneli geçerli bir telefon numarası girin"
                  required
                />
              </div>
            </div>

            <!-- Şifre -->
            <div class="col-12 col-sm-6">
              <label for="registerPassword" class="form-label fw-semibold"
                >Şifre</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light text-muted">
                  <i class="bi bi-lock"></i>
                </span>
                <input
                  type="password"
                  class="form-control"
                  id="registerPassword"
                  name="password"
                  placeholder="••••••••"
                  required
                  minlength="8"
                  maxlength="32"
                />
              </div>
            </div>

            <!-- Şifre Tekrar -->
            <div class="col-12 col-sm-6">
              <label for="confirmPassword" class="form-label fw-semibold"
                >Şifre Tekrar</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light text-muted">
                  <i class="bi bi-lock-fill"></i>
                </span>
                <input
                  type="password"
                  class="form-control"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="••••••••"
                  required
                  minlength="8"
                  maxlength="32"
                />
              </div>
            </div>

            <!-- Kullanım Koşulları Onayı -->
            <div class="col-12 my-2">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="termsCheck"
                  name="terms"
                  required
                />
                <label
                  class="form-check-label small text-muted"
                  for="termsCheck"
                >
                  <a
                    href="#"
                    class="text-decoration-none text-primary fw-semibold"
                    >Kullanım koşullarını</a
                  >
                  okudum ve kabul ediyorum.
                </label>
              </div>
            </div>

            <!-- Hesap Oluştur Butonu -->
            <div class="col-12 mt-3">
              <button
                type="submit"
                class="btn btn-primary w-100 py-2 fw-bold shadow-sm"
              >
                Hesap Oluştur
              </button>
            </div>
          </div>
        </form>

        <!-- Giriş Yap Yönlendirmesi -->
        <div class="text-center small text-secondary mt-4 border-top pt-3">
          Zaten hesabın var mı?
          <a
            href="login.html"
            class="text-decoration-none fw-semibold text-primary ms-1"
            >Giriş Yap</a
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
