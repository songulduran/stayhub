<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayHub - Giriş Yap</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <!-- Ekranı Dikey ve Yatayda Ortalamak İçin Flex Kapsayıcı -->
    <div
      class="container d-flex justify-content-center align-items-center login-container py-5"
    >
      <!-- Ortalanmış Giriş Kartı -->
      <div class="card border-0 shadow-sm rounded-3 p-4 p-sm-5 auth-card">
        <!-- Logo veya Marka İsmi -->
        <div class="text-center mb-4">
          <a
            href="index.html"
            class="text-decoration-none fw-bold fs-3 text-primary"
          >
            <i class="bi bi-building-fill me-2"></i>StayHub
          </a>
        </div>

        <h4 class="fw-bold text-center mb-1 text-dark">Tekrar Hoş Geldiniz</h4>
        <p class="text-muted text-center small mb-4">
          Hesabınıza erişmek için bilgilerinizi girin
        </p>

        <form onsubmit="event.preventDefault()">
          <!-- E-posta -->
          <div class="mb-3">
            <label for="loginEmail" class="form-label fw-semibold"
              >E-posta</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light text-muted">
                <i class="bi bi-envelope"></i>
              </span>
              <input
                type="email"
                class="form-control"
                id="loginEmail"
                placeholder="ornek@email.com"
                required
              />
            </div>
          </div>

          <!-- Şifre -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="loginPassword" class="form-label fw-semibold mb-0"
                >Şifre</label
              >
              <a href="#" class="text-decoration-none small text-primary"
                >Şifremi unuttum</a
              >
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted">
                <i class="bi bi-lock"></i>
              </span>
              <input
                type="password"
                class="form-control"
                id="loginPassword"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <!-- Giriş Yap Butonu -->
          <div class="mt-4 mb-3">
            <button
              type="submit"
              class="btn btn-primary w-100 py-2 fw-bold shadow-sm"
            >
              Giriş Yap
            </button>
          </div>

          <!-- Kayıt Ol Yönlendirmesi -->
          <div class="text-center small text-secondary mt-4 border-top pt-3">
            Hesabın yok mu?
            <a
              href="register.html"
              class="text-decoration-none fw-semibold text-primary ms-1"
              >Kayıt Ol</a
            >
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
