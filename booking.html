<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayHub - Rezervasyon Bilgileri</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <div class="row g-4">
        <!-- SOL TARAFI: Kullanıcı Bilgileri Formu -->
        <div class="col-12 col-lg-8">
          <div class="card border-0 shadow-sm rounded-3 p-4">
            <h4 class="fw-bold mb-4 text-dark border-bottom pb-2">
              <i class="bi bi-person-lines-fill text-primary me-2"></i>Misafir
              Bilgileri
            </h4>

            <form>
              <div class="row g-3">
                <!-- Ad & Soyad -->
                <div class="col-12 col-md-6">
                  <label for="firstName" class="form-label fw-semibold"
                    >Ad</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    placeholder="Adınız"
                    required
                  />
                </div>
                <div class="col-12 col-md-6">
                  <label for="lastName" class="form-label fw-semibold"
                    >Soyad</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="lastName"
                    placeholder="Soyadınız"
                    required
                  />
                </div>

                <!-- E-posta & Telefon -->
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label fw-semibold"
                    >E-posta</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="ornek@email.com"
                    required
                  />
                </div>
                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label fw-semibold"
                    >Telefon</label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    placeholder="+90 5XX XXX XX XX"
                    required
                  />
                </div>

                <!-- Ülke -->
                <div class="col-12">
                  <label for="country" class="form-label fw-semibold"
                    >Ülke</label
                  >
                  <select class="form-select" id="country" required>
                    <option value="" selected disabled>Ülke seçiniz</option>
                    <option value="TR">Türkiye</option>
                    <option value="DE">Almanya</option>
                    <option value="US">Amerika Birleşik Devletleri</option>
                    <option value="GB">İngiltere</option>
                  </select>
                </div>

                <!-- Özel İstekler -->
                <div class="col-12">
                  <label for="specialRequests" class="form-label fw-semibold"
                    >Özel İstekler</label
                  >
                  <textarea
                    class="form-control"
                    id="specialRequests"
                    rows="4"
                    placeholder="Erkek/Kadın ayrı yatak, geç giriş veya özel tercihinizi belirtebilirsiniz..."
                  ></textarea>
                </div>

                <!-- Devam Et Butonu -->
                <div class="col-12 mt-4">
                  <button
                    type="submit"
                    class="btn btn-primary w-100 py-2 fw-bold"
                  >
                    Ödemeye İlerle
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- SAĞ TARAFI: Rezervasyon Özeti -->
        <div class="col-12 col-lg-4">
          <div
            class="card border-0 shadow-sm rounded-3 p-4 booking-summary-card"
          >
            <h5 class="fw-bold mb-3 text-dark border-bottom pb-2">
              <i class="bi bi-journal-check me-2 text-primary"></i>Rezervasyon
              Özeti
            </h5>

            <!-- Otel Bilgisi -->
            <div class="mb-3">
              <h6 class="fw-bold mb-1 text-primary">Swissotel The Bosphorus</h6>
              <p class="text-muted small mb-0">Deluxe Boğaz Manzaralı Oda</p>
            </div>

            <hr class="text-muted" />

            <!-- Tarih Bilgisi -->
            <div class="row text-center my-3 g-2">
              <div class="col-6 border-end">
                <small class="text-muted d-block">Giriş</small>
                <strong class="text-dark">15 Ağustos</strong>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Çıkış</small>
                <strong class="text-dark">18 Ağustos</strong>
              </div>
            </div>

            <hr class="text-muted" />

            <!-- Detaylar -->
            <ul
              class="list-unstyled small text-secondary mb-0 d-flex flex-column gap-2"
            >
              <li class="d-flex justify-content-between">
                <span>Konaklama Süresi:</span>
                <strong class="text-dark">3 gece</strong>
              </li>
              <li class="d-flex justify-content-between">
                <span>Misafir Sayısı:</span>
                <strong class="text-dark">2 yetişkin</strong>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
